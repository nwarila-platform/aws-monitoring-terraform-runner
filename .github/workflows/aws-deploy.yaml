name: AWS Deploy

# Applies the pinned aws-monitoring-terraform-framework commit, with this repository's values, to
# the organization account, then reads the deployment back from AWS. Every merge to main converges
# it; nothing outside main can reach AWS. Once a day the read-back runs alone, with no apply, so a
# subscription or a rule lost since the last converge is noticed within a day rather than never; a
# manual dispatch with read_back_only runs that same check on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      read_back_only:
        description: Skip the converge and run the strict read-back alone, as the daily schedule does
        type: boolean
        default: false

permissions: {}

# One state key, one deployment: never two applies at once, never cancel a live apply.
concurrency:
  group: aws-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  main-ref:
    name: Protected main ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse privileged execution outside protected main
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "::error::AWS deploys run only from ${EXPECTED_REF}; got ${GITHUB_REF}."
            exit 1
          fi

  aws-deploy:
    name: Converge monitoring
    needs: main-ref
    if: github.event_name != 'schedule' && !inputs.read_back_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write # required to mint the GitHub OIDC token the deploy role trusts
      contents: read # required to check out this repository and the pinned framework
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE: nwarila-platform_aws-monitoring-terraform-runner_runner
      FRAMEWORK: .frameworks/aws-monitoring-terraform-framework

    steps:
      - name: Check out runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # actions/checkout cannot read a file into ref:, so the pin passes through a step output,
      # validated as exactly one 40-character SHA before it can address anything.
      - name: Read the framework pin
        id: pin
        run: |
          set -euo pipefail
          mapfile -t lines < .github/terraform-framework-pin
          if [ "${#lines[@]}" -ne 1 ] || [[ ! "${lines[0]}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/terraform-framework-pin must hold exactly one lowercase 40-character SHA."
            exit 1
          fi
          echo "sha=${lines[0]}" >> "${GITHUB_OUTPUT}"

      - name: Check out aws-monitoring-terraform-framework (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/aws-monitoring-terraform-framework
          ref: ${{ steps.pin.outputs.sha }}
          path: .frameworks/aws-monitoring-terraform-framework
          persist-credentials: false

      # Recipients come from a secret rather than the value file: this repository is public and a
      # published address is a scraped address. GitHub masks only the exact secret string, so each
      # address is registered on its own, before anything prints, and is then redacted wherever it
      # appears in this job's log, inside a Terraform diff line included. The secret is a JSON
      # array of address strings; an unset or malformed one stops the deploy here, because the
      # alternative is a channel that applies green and emails nobody.
      - name: Mask the recipients
        env:
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${ALERT_EMAILS}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' > /dev/null 2>&1; then
            echo '::error::The ALERT_EMAILS repository secret must be a JSON array of one or more address strings, for example ["alerts@example.com"]; HCL forms such as a trailing comma are refused.'
            exit 1
          fi
          printf '%s' "${ALERT_EMAILS}" | jq -r '.[]' | while read -r address; do
            echo "::add-mask::${address}"
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
          terraform_version: "1.15.1"
          terraform_wrapper: false

      - name: Terraform init
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp terraform/prod.tfvars "${FRAMEWORK}/terraform/terraform.tfvars"
          terraform -chdir="${FRAMEWORK}/terraform" init -input=false -lockfile=readonly \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-terraform"               \
            -backend-config="key=${GITHUB_REPOSITORY}/terraform.tfstate"       \
            -backend-config="region=${AWS_REGION}"

      # Identity is passed as command-line -var so the value file cannot restate who deployed.
      # CommitSha is this runner's checked-out commit, read back from git rather than github.sha.
      # The recipients travel the same way: a JSON array is an HCL list.
      - name: Terraform plan
        env:
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: |
          set -euo pipefail
          terraform -chdir="${FRAMEWORK}/terraform" plan -input=false -out=tfplan \
            -var "alert_emails=${ALERT_EMAILS}"                                  \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"     \
            -var "repository=${GITHUB_REPOSITORY}"                               \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                         \
            -var "run_id=${GITHUB_RUN_ID}"

      # A plan that creates a trail must find an account with none; one that does not must find a
      # covering trail already there. Both are decided before anything is applied.
      - name: Verify the account's CloudTrail configuration
        run: bash "${FRAMEWORK}/tools/check_cloudtrail.sh" --plan "${FRAMEWORK}/terraform/tfplan"

      # This runner's own role is a real member of the exempt fleet, so a misspelt pattern fails.
      - name: Prove the planned event patterns against EventBridge
        run: bash "${FRAMEWORK}/tools/check_event_patterns.sh" "${FRAMEWORK}/terraform/tfplan" "${DEPLOY_ROLE}"

      - name: Terraform apply
        run: terraform -chdir="${FRAMEWORK}/terraform" apply -input=false tfplan

      - name: Verify a logging trail now covers the region
        run: bash "${FRAMEWORK}/tools/check_cloudtrail.sh"

      - name: Record what was deployed
        env:
          FRAMEWORK_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Monitoring deployed"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner commit | $(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD) |"
            echo "| Framework commit | ${FRAMEWORK_SHA} |"
            echo "| Run | ${GITHUB_RUN_ID} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Terraform's own report is not the proof: the rules, targets, topics, subscriptions and alarms
  # are read back from AWS and compared with what Terraform last applied. After a converge that
  # is the deploy's acceptance; on the daily schedule, with the converge skipped, it is the only
  # thing that notices a subscription or a rule lost since. GitHub skips a job whose needed job
  # was skipped unless its own condition says otherwise, so this one names the outcomes it runs
  # after: a successful converge, or none. Never after a failed or cancelled one.
  verify:
    name: Read the deployment back
    needs: [main-ref, aws-deploy]
    if: ${{ !cancelled() && needs.main-ref.result == 'success' && (needs.aws-deploy.result == 'success' || needs.aws-deploy.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write # required to mint the GitHub OIDC token the deploy role trusts
      contents: read # required to check out this repository and the pinned framework
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE: nwarila-platform_aws-monitoring-terraform-runner_runner
      FRAMEWORK: .frameworks/aws-monitoring-terraform-framework

    steps:
      - name: Check out runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read the framework pin
        id: pin
        run: |
          set -euo pipefail
          mapfile -t lines < .github/terraform-framework-pin
          if [ "${#lines[@]}" -ne 1 ] || [[ ! "${lines[0]}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/terraform-framework-pin must hold exactly one lowercase 40-character SHA."
            exit 1
          fi
          echo "sha=${lines[0]}" >> "${GITHUB_OUTPUT}"

      - name: Check out aws-monitoring-terraform-framework (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/aws-monitoring-terraform-framework
          ref: ${{ steps.pin.outputs.sha }}
          path: .frameworks/aws-monitoring-terraform-framework
          persist-credentials: false

      # Masks are per job: registered again here before Terraform or AWS prints anything.
      - name: Mask the recipients
        env:
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${ALERT_EMAILS}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' > /dev/null 2>&1; then
            echo '::error::The ALERT_EMAILS repository secret must be a JSON array of one or more address strings, for example ["alerts@example.com"]; HCL forms such as a trailing comma are refused.'
            exit 1
          fi
          printf '%s' "${ALERT_EMAILS}" | jq -r '.[]' | while read -r address; do
            echo "::add-mask::${address}"
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-verify-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
          terraform_version: "1.15.1"
          terraform_wrapper: false

      # State is read, never written: init, then `terraform show -json` inside the verifier.
      - name: Terraform init
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp terraform/prod.tfvars "${FRAMEWORK}/terraform/terraform.tfvars"
          terraform -chdir="${FRAMEWORK}/terraform" init -input=false -lockfile=readonly \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-terraform"               \
            -backend-config="key=${GITHUB_REPOSITORY}/terraform.tfstate"       \
            -backend-config="region=${AWS_REGION}"

      # Strict on the schedule: a pending or extra address and an alarm in ALARM fail, because
      # nothing else will report them. After a converge a pending address is the normal state of
      # a recipient who has not yet followed the link, so it warns. Counts only, never an address.
      - name: Verify the deployed monitoring against AWS
        env:
          MODE: ${{ (github.event_name == 'schedule' || inputs.read_back_only) && 'strict' || 'post-apply' }}
        # The summary is written whatever the outcome, since a failed read-back is the one a
        # person most needs to read; the step then exits with the verifier's own status. GitHub
        # runs this shell with -e, so the pipeline's failure is caught here rather than ending it.
        run: |
          set -uo pipefail
          status=0
          bash tools/verify_deployment.sh "${FRAMEWORK}/terraform" "${MODE}" 2>&1 | tee verify.log || status=$?
          {
            echo "## Deployment read back (${MODE})"
            echo
            echo '```'
            cat verify.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
